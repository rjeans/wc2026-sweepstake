name: Build and deploy sweepstake

# The tournament is over and the site is static: no scheduled data refresh.
# It rebuilds and deploys only when the repo changes (or on a manual run).
on:
  workflow_dispatch: {}        # manual trigger from the Actions tab
  push:
    branches: [main]           # code/content changes deploy

permissions:
  contents: read

# Run JS-based actions on Node 24 (Node 20 is being deprecated mid-June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: sweepstake
  cancel-in-progress: false    # let any in-flight run finish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wc2026-sweepstake
