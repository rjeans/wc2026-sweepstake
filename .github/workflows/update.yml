name: Update and deploy sweepstake

on:
  schedule:
    # Every 30 minutes. GitHub may delay during high load; that's fine.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}        # manual trigger from the Actions tab
  push:
    branches: [main]           # code/content changes deploy too

permissions:
  contents: write              # to commit refreshed data for history

# Run JS-based actions on Node 24 (Node 20 is being deprecated mid-June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: sweepstake
  cancel-in-progress: false    # let any in-flight run finish

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # fetch_results.py / scoring.py / scrape_elo.py / predict.py are stdlib-only.
      - name: Fetch results + fixtures from ESPN
        run: |
          python fetch_results.py \
            --teams src/data/teams.csv \
            --output src/data/results.csv \
            --matches src/data/matches.csv

      - name: Refresh Elo ratings (best effort)
        continue-on-error: true
        run: python scrape_elo.py

      - name: Compute standings (if the draw has happened)
        run: |
          if [ -f src/data/allocation.csv ]; then
            python scoring.py \
              --alloc src/data/allocation.csv \
              --results src/data/results.csv \
              --matches src/data/matches.csv \
              --output src/data/standings.csv
          else
            echo "::notice::No allocation.csv yet - skipping scoring (pre-draw)."
          fi

      - name: Run Monte Carlo predictor (50k trials)
        run: |
          if [ -f src/data/allocation.csv ]; then
            python predict.py
          else
            echo "::notice::No allocation.csv yet - skipping predictor."
          fi

      # Persist refreshed data for history. [skip ci] stops this commit from
      # re-triggering the workflow (which would otherwise loop).
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --cached --quiet; then
            echo "::notice::No data changes."
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) update [skip ci]"
            git push
          fi

      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wc2026-sweepstake
